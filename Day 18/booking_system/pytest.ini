[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers --cov=src --cov-report=term --cov-report=html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: unit tests
    integration: integration tests
    smoke: smoke tests